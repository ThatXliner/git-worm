[project]
name = "git-worm"
version = "0.1.0"
description = "A better git worktree manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xclif @ git+https://github.com/ThatXliner/xclif.git",
]

[project.scripts]
git-worm = "git_worm.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/git_worm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]
